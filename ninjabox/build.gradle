plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def props = new Properties()
def localProps = rootProject.file('local.properties')
if (localProps.exists()) {
    localProps.withInputStream { props.load(it) }
}
def tmdbKey = props.getProperty('TMDB_API_KEY', '')

android {
    namespace 'xyz.ninjatreats.ninjabox'
    compileSdk 36

    defaultConfig {
        applicationId 'xyz.ninjatreats.ninjabox'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        buildConfigField 'String', 'PANEL_BASE_URL', '"https://ninjatreats.xyz/project/clipbox/panel/"'
        buildConfigField 'String', 'TMDB_API_KEY', '"' + tmdbKey + '"'
        resValue 'string', 'app_name', 'NinjaBox'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}