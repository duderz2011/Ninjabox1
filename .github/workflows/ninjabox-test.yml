name: NinjaBox Test APKs

on:
  workflow_dispatch:
  push:
    branches:
      - ninjabox-integration
    paths:
      - 'app/**'
      - 'navigation/**'
      - 'retrofit-jsoup-converter/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/ninjabox-test.yml'

jobs:
  build:
    name: Build NinjaBox debug APKs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [mobile, tv]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create local.properties
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
          APP_LAYOUT: ${{ matrix.layout }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "APP_LAYOUT=$APP_LAYOUT"
            echo "TMDB_API_KEY=$TMDB_API_KEY"
            echo "SUBDL_API_KEY=$SUBDL_API_KEY"
            echo "RABBITSTREAM_SOURCE_API=$RABBITSTREAM_SOURCE_API"
          } > local.properties

      - name: Generate native-lib.cpp
        shell: bash
        env:
          UPROT_MSFI_API_BASE: ${{ secrets.UPROT_MSFI_API_BASE }}
          UPROT_MSE_API_BASE: ${{ secrets.UPROT_MSE_API_BASE }}
          UPROT_API_KEY: ${{ secrets.UPROT_API_KEY }}
        run: |
          sed -e "s|{{UPROT_MSFI_API_BASE}}|$UPROT_MSFI_API_BASE|g" \
              -e "s|{{UPROT_MSE_API_BASE}}|$UPROT_MSE_API_BASE|g" \
              -e "s|{{UPROT_API_KEY}}|$UPROT_API_KEY|g" \
              app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/NinjaBox-${{ matrix.layout }}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NinjaBox-${{ matrix.layout }}-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
